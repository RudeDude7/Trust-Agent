name: Deploy Backend to Hugging Face Spaces

# This tells GitHub to only run this script when code is pushed to the 'main' branch
on:
  push:
    branches:
      - main
  # This allows you to manually click a "Run" button in GitHub to trigger a deployment
  workflow_dispatch:

jobs:
  deploy:
    name: Sync Backend to HF Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: RudeDude7
          SPACE_NAME: trust-agent
        
        # We use "git subtree split" to extract ONLY the /backend folder from your GitHub repo.
        # It pushes that specific folder to the root of your Hugging Face Space so HF can find the Dockerfile.
        run: |
          git push https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME `git subtree split -q --prefix backend HEAD`:main --force
