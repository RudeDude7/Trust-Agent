name: Deploy Backend to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sync Backend to HF Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: RudeDude7
          SPACE_NAME: trust-agent
        run: |
          # 1. Verify the token is available
          if [ -z "$HF_TOKEN" ]; then
            echo "Error: HF_TOKEN secret is empty! Please check your GitHub repository secrets."
            exit 1
          fi

          # 2. Extract the backend folder into a new commit hash
          echo "Splitting the backend folder..."
          COMMIT_HASH=$(git subtree split -q --prefix backend HEAD)
          echo "Generated subtree hash: $COMMIT_HASH"
          
          if [ -z "$COMMIT_HASH" ]; then
            echo "Error: git subtree split failed to generate a hash!"
            exit 1
          fi

          # 3. Push the specific commit hash to the Hugging Face Space 'main' branch
          echo "Pushing to Hugging Face..."
          git push https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME $COMMIT_HASH:main --force
